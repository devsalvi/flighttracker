name: Deploy to AWS Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # only used if you switch to the OIDC role below

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Option A (simplest): an IAM user's access key stored as repo secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Option B (no long-lived secret): comment out A, uncomment this, and create an OIDC role
      # trusted by repo:devsalvi/flighttracker:ref:refs/heads/main with infra/deploy-policy.json attached.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy (Amplify manual deployment - no build minutes)
        run: ./infra/deploy.sh | tee deploy.log

      - name: Summary
        run: grep '✅' deploy.log >> "$GITHUB_STEP_SUMMARY" || true
